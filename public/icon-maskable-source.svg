<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#241403"/>
      <stop offset="55%" stop-color="#0c0905"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="needleN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="needleS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a12"/>
      <stop offset="100%" stop-color="#2a1a06"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a4a08"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512"  fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5"/>

  <!-- tick marks N E S W -->
  <g stroke="#f9a94f" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="76" x2="256" y2="104"/>
    <line x1="256" y1="408" x2="256" y2="436"/>
    <line x1="76" y1="256" x2="104" y2="256"/>
    <line x1="408" y1="256" x2="436" y2="256"/>
  </g>

  <!-- compass needle -->
  <g filter="url(#glow)">
    <polygon points="256,96 300,256 256,232 212,256" fill="url(#needleN)"/>
    <polygon points="256,416 300,256 256,280 212,256" fill="url(#needleS)"/>
  </g>

  <!-- hub -->
  <circle cx="256" cy="256" r="26" fill="#1a1206" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="256" cy="256" r="9" fill="#ffd27a"/>
</svg>
